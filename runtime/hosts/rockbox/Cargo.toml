[package]
name = "pocketjs-rockbox"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
crate-type = ["staticlib"]
path = "src/lib.rs"
test = false
bench = false

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.dev]
panic = "abort"

[features]
# Rockbox playback/system model services; the host must link
# pocketjs_host_playback and pocketjs_host_system (see src/services.rs).
services = []
# App-owned Rust renderer supplied through POCKETJS_RENDERER.
custom-renderer = []

[dependencies]
microts = { path = "../../engine/crates/microts", features = ["critical-section"] }
linked_list_allocator = { version = "0.10.5", default-features = false }
critical-section = { version = "1.2", features = ["restore-state-none"] }
